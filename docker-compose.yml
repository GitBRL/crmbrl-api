# BRL CRM — sobe o sistema inteiro: banco (PostgreSQL 17), arquivos (MinIO),
# API (esta pasta), gateway de WhatsApp (a mesma imagem da API, outro processo)
# e front (Angular servido pelo Caddy, construído a partir de ../crmbrl).
#
#   docker compose up -d --build    constrói as imagens e sobe tudo
#   docker compose ps               estado e saúde de cada serviço
#   docker compose logs -f api      acompanha os logs da API
#   docker compose up -d banco      sobe só o banco (para rodar a API fora do Docker)
#   docker compose down             desliga (os dados ficam no volume)
#   docker compose down -v          desliga e apaga os dados do banco
#
# Sem o plugin "docker compose" na máquina? Use a imagem oficial do Docker CLI,
# com os mesmos argumentos no fim:
#
#   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
#     -v /sistemas/crm-brl:/sistemas/crm-brl -w /sistemas/crm-brl/crmbrl-api \
#     docker:cli docker compose up -d --build
#
# Endereços: front em http://localhost:8080 (é por ele que se usa o CRM: o Caddy
# encaminha /api à API, inclusive o websocket do tempo real em /api/socket.io)
# · API direta só na própria máquina, em http://127.0.0.1:3000/api · banco em
# 127.0.0.1:5434 (usuário, senha e banco: crmbrl). MinIO (arquivos) e gateway
# de WhatsApp ficam só na rede interna do compose, sem porta no host.
#
# Toda variável abaixo pode vir do ambiente ou de um .env nesta pasta (veja o
# .env.example). Os padrões servem para desenvolvimento local em http; para
# produção defina pelo menos URL_PUBLICA, ORIGENS_PERMITIDAS, COOKIE_SEGURO=true,
# CHAVE_CRIPTOGRAFIA (openssl rand -base64 32), ARQUIVOS_CHAVE/ARQUIVOS_SEGREDO,
# WHATSAPP_TOKEN_INTERNO (openssl rand -base64 32) e o SMTP.
#
# Primeiro acesso: sem ADMIN_SENHA_INICIAL, a API gera uma senha para o
# ADMIN_EMAIL e a mostra uma vez no log (docker compose logs api); a troca é
# obrigatória no primeiro login.

name: crmbrl

# Variáveis lidas pelos dois processos da imagem da API (a API e o gateway de
# WhatsApp): banco, chave de criptografia, endereço público, arquivos e o
# contrato entre os dois (endereço interno e token do gateway).
x-ambiente-da-imagem: &ambiente-da-imagem
  # Banco (R35.1). DATABASE_URL_MIGRACAO: o dono (as credenciais do serviço banco),
  # só para as migrations e o papel da aplicação. DATABASE_URL: o papel próprio da
  # aplicação (BANCO_APP_USUARIO, sem superusuário, só DML, com a RLS valendo),
  # criado na subida com a senha BANCO_APP_SENHA (openssl rand -hex 32). Sem
  # BANCO_APP_SENHA, a API usa o dono, como antes (com aviso no log e na Saúde).
  # Senha com caractere especial de URL (@ : / ? #) precisa ir codificada
  # (ex.: %40 no lugar de @).
  DATABASE_URL: postgresql://${BANCO_APP_USUARIO:-crmbrl_app}:${BANCO_APP_SENHA:-}@banco:5432/${BANCO_NOME:-crmbrl}?schema=public
  DATABASE_URL_MIGRACAO: postgresql://${BANCO_USUARIO:-crmbrl}:${BANCO_SENHA:-crmbrl}@banco:5432/${BANCO_NOME:-crmbrl}?schema=public
  BANCO_APP_USUARIO: ${BANCO_APP_USUARIO:-crmbrl_app}
  BANCO_APP_SENHA: ${BANCO_APP_SENHA:-}
  # Endereço do front (Caddy): base dos links de e-mail e dos endereços de webhook.
  URL_PUBLICA: ${URL_PUBLICA:-http://localhost:8080}
  # Origens aceitas em POST/PUT/PATCH/DELETE e no tempo real (proteção CSRF, R2.9).
  ORIGENS_PERMITIDAS: ${ORIGENS_PERMITIDAS:-http://localhost:8080}
  # Chave pública de desenvolvimento (a API avisa no log): troque em produção.
  CHAVE_CRIPTOGRAFIA: ${CHAVE_CRIPTOGRAFIA:-QgJh7zlsW/dNWZEIgY5FuRfgyxtaDc6dfihpFVnoe+A=}
  # Arquivos (R11) no MinIO do serviço "arquivos"; o bucket é criado pela API.
  ARQUIVOS_DRIVER: ${ARQUIVOS_DRIVER:-s3}
  ARQUIVOS_ENDPOINT: ${ARQUIVOS_ENDPOINT:-http://arquivos:9000}
  ARQUIVOS_REGIAO: ${ARQUIVOS_REGIAO:-us-east-1}
  ARQUIVOS_CHAVE: ${ARQUIVOS_CHAVE:-crmbrl}
  ARQUIVOS_SEGREDO: ${ARQUIVOS_SEGREDO:-crmbrl-arquivos-desenvolvimento}
  ARQUIVOS_BUCKET: ${ARQUIVOS_BUCKET:-crmbrl}
  # Gateway de WhatsApp (R13): comandos por HTTP interno, com o mesmo token nos
  # dois lados. O padrão é o token público de desenvolvimento (com aviso no log).
  WHATSAPP_URL_INTERNA: http://whatsapp:3100
  WHATSAPP_PORTA: '3100'
  WHATSAPP_TOKEN_INTERNO: ${WHATSAPP_TOKEN_INTERNO:-crmbrl-token-interno-de-desenvolvimento-nao-use-em-producao}
  # true = transporte simulado (QR de mentira, sem WhatsApp de verdade).
  WHATSAPP_SIMULADO: ${WHATSAPP_SIMULADO:-false}
  # Graph API da Meta (Instagram e Messenger, R14).
  META_GRAPH_URL: ${META_GRAPH_URL:-https://graph.facebook.com}
  META_GRAPH_VERSAO: ${META_GRAPH_VERSAO:-v24.0}
  META_DIALOGO_URL: ${META_DIALOGO_URL:-https://www.facebook.com}
  # APIs dos aplicativos das integrações (Typeform e ManyChat, R32); no ambiente dos agentes, as falsas do apoio.
  TYPEFORM_API_URL: ${TYPEFORM_API_URL:-https://api.typeform.com}
  MANYCHAT_API_URL: ${MANYCHAT_API_URL:-https://api.manychat.com}
  # Login facilitado (H4): diálogos (abertos no navegador) e API do RD Station Marketing.
  TYPEFORM_DIALOGO_URL: ${TYPEFORM_DIALOGO_URL:-https://api.typeform.com}
  RD_STATION_API_URL: ${RD_STATION_API_URL:-https://api.rd.services}
  RD_STATION_DIALOGO_URL: ${RD_STATION_DIALOGO_URL:-https://api.rd.services}
  # Ligações pelo WhatsApp oficial (R29): STUN opcional do navegador e espera entre pre_accept e accept.
  LIGACOES_STUN_URLS: ${LIGACOES_STUN_URLS:-}
  LIGACOES_ESPERA_PRE_ACEITE_MS: ${LIGACOES_ESPERA_PRE_ACEITE_MS:-800}
  # Gravação, transcrição e resumo das ligações (R30). TRANSCRICAO_URL vazia = transcrição desligada
  # (a gravação continua; o serviço "transcricao" abaixo pode ser removido do compose).
  TRANSCRICAO_URL: ${TRANSCRICAO_URL-http://transcricao:8080}
  WHISPER_MODELO: ${WHISPER_MODELO:-small}
  TRANSCRICAO_TEMPO_LIMITE_S: ${TRANSCRICAO_TEMPO_LIMITE_S:-1800}
  LIGACOES_GRAVACAO_MAX_MB: ${LIGACOES_GRAVACAO_MAX_MB:-200}
  LIGACOES_GRAVACAO_MAX_MIN: ${LIGACOES_GRAVACAO_MAX_MIN:-180}
  LIGACOES_RESUMO_MODELO: ${LIGACOES_RESUMO_MODELO:-claude-sonnet-5-5}
  # 3C+ (R34): hosts aceitos além de 3c.plus e 3c.fluxoti.com (lista por vírgula; no ambiente dos agentes, o simulado).
  TRESC_PLUS_HOSTS_PERMITIDOS: ${TRESC_PLUS_HOSTS_PERMITIDOS:-}
  PROCESSAR_FILAS: ${PROCESSAR_FILAS:-true}
  LOG_FORMATO: ${LOG_FORMATO:-json}

services:
  banco:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BANCO_USUARIO:-crmbrl}
      POSTGRES_PASSWORD: ${BANCO_SENHA:-crmbrl}
      POSTGRES_DB: ${BANCO_NOME:-crmbrl}
    ports:
      - '127.0.0.1:${BANCO_PORTA:-5434}:5432'
    volumes:
      - banco-dados:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  arquivos:
    # MinIO (armazenamento compatível com S3) para os arquivos do CRM (R11). A
    # imagem oficial minio/minio deixou de ser publicada: esta é a da Bitnami
    # (bitnamilegacy), com o MinIO RELEASE 2025-07-23, versão fixada.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${ARQUIVOS_CHAVE:-crmbrl}
      MINIO_ROOT_PASSWORD: ${ARQUIVOS_SEGREDO:-crmbrl-arquivos-desenvolvimento}
      # Console web desligado; o bucket é criado pela API ao subir.
      MINIO_BROWSER: 'off'
      MINIO_SKIP_CLIENT: 'yes'
    volumes:
      - arquivos-dados:/bitnami/minio/data
    # Sem porta no host: só a API e o gateway falam com o MinIO, pela rede interna.
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-fsS',
          '-o',
          '/dev/null',
          'http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  transcricao:
    # Transcrição das ligações (R30): whisper.cpp (licença MIT) em CPU, chamado pela API por HTTP em
    # http://transcricao:8080/inference. Imagem oficial fixada por digest (tag main de 02/11/2026; para
    # atualizar, baixe a nova e troque o digest: docker buildx imagetools inspect ghcr.io/ggml-org/whisper.cpp:main).
    # O entrypoint baixa o modelo WHISPER_MODELO (padrão small, ~470 MB) na primeira subida para o volume
    # "modelos-whisper"; o servidor só escuta na rede do compose (sem porta no host).
    # Limite de CPU/memória: TRANSCRICAO_CPUS e TRANSCRICAO_MEMORIA (small pede ~1 GB; medium ~2,5 GB).
    image: ghcr.io/ggml-org/whisper.cpp@sha256:5c78763e9c36861c140b748eb6fd982a4aee52a8a503018cb6703c571f2fa1b5
    restart: unless-stopped
    entrypoint: ['/bin/bash', '/entrypoint.sh']
    environment:
      WHISPER_MODELO: ${WHISPER_MODELO:-small}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      # Detecção de voz (Silero, ~900 KB, baixada junto): sem ela, os tempos dos trechos saem errados
      # quando um canal fica calado por muito tempo.
      WHISPER_VAD: ${WHISPER_VAD:-true}
    cpus: ${TRANSCRICAO_CPUS:-4}
    mem_limit: ${TRANSCRICAO_MEMORIA:-3g}
    volumes:
      - modelos-whisper:/modelos
      - ./scripts/transcricao-entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # Fica "starting" enquanto o modelo baixa e carrega (a primeira subida leva alguns minutos).
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *ambiente-da-imagem
      MIGRAR_AO_INICIAR: ${MIGRAR_AO_INICIAR:-true}
      CORS_ORIGENS: ${CORS_ORIGENS:-}
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-}
      # http local: sem o atributo Secure no cookie. Em HTTPS, true.
      COOKIE_SEGURO: ${COOKIE_SEGURO:-false}
      SESSAO_INATIVIDADE_DIAS: ${SESSAO_INATIVIDADE_DIAS:-7}
      SESSAO_DURACAO_MAXIMA_DIAS: ${SESSAO_DURACAO_MAXIMA_DIAS:-30}
      SESSAO_RENOVACAO_MINUTOS: ${SESSAO_RENOVACAO_MINUTOS:-5}
      # Análise do BI por IA (R21), só na API: vazia = desligada (a tela explica
      # como configurar).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Chamados do assistente de IA no TicketHub (R25): conta de serviço. O
      # Admin também pode configurar pela tela (cifrado no banco).
      TICKETHUB_URL: ${TICKETHUB_URL:-}
      TICKETHUB_EMAIL: ${TICKETHUB_EMAIL:-}
      TICKETHUB_SENHA: ${TICKETHUB_SENHA:-}
      # Notificações push (R26): par de chaves VAPID e contato. Vazias = push
      # desligado (a tela explica). Gere com `npx web-push generate-vapid-keys`.
      VAPID_CHAVE_PUBLICA: ${VAPID_CHAVE_PUBLICA:-}
      VAPID_CHAVE_PRIVADA: ${VAPID_CHAVE_PRIVADA:-}
      VAPID_ASSUNTO: ${VAPID_ASSUNTO:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@crmbrl.local}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_SENHA_INICIAL: ${ADMIN_SENHA_INICIAL:-}
      # Sem SMTP_HOST, convite e "esqueci minha senha" ficam indisponíveis.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_SEGURO: ${SMTP_SEGURO:-}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      WEBHOOKS_PERMITIR_REDE_INTERNA: ${WEBHOOKS_PERMITIR_REDE_INTERNA:-false}
      # Documentação em /api/docs: false = só o Admin logado.
      DOCS_PUBLICAS: ${DOCS_PUBLICAS:-false}
      # Pasta do volume dos backups (somente leitura), onde está o ultimo.json.
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
    volumes:
      # Dumps do serviço backup, só leitura: a saúde lê /backups/ultimo.json.
      - backups:/backups:ro
    depends_on:
      banco:
        condition: service_healthy
      arquivos:
        condition: service_healthy
    ports:
      # Só na própria máquina: o front fala com a API pelo Caddy (rede do compose).
      - '127.0.0.1:${API_PORTA:-3000}:3000'
    # A saúde vem do HEALTHCHECK do Dockerfile (GET /api/saude; 503 = banco fora).

  whatsapp:
    # Gateway de WhatsApp (R13): a mesma imagem da API, outro processo
    # (node dist/whatsapp/main.js). Mantém as conexões dos números (Baileys),
    # recebe os comandos da API pelo HTTP interno e troca mensagens e eventos
    # com ela pelas filas do pg-boss. Uma instância só.
    build: .
    restart: unless-stopped
    command: ['whatsapp']
    environment:
      <<: *ambiente-da-imagem
    depends_on:
      # A API aplica as migrations antes; o gateway sobe depois dela.
      api:
        condition: service_healthy
      arquivos:
        condition: service_healthy
    # Sem porta no host: só a API fala com o gateway (http://whatsapp:3100).
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3100/saude']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    # Backup diário do banco: pg_dump (formato custom) no volume "backups", com
    # retenção por dias, e o resultado de cada execução em /backups/ultimo.json
    # (a API monta o mesmo volume só leitura e mostra na tela "Saúde do sistema").
    # Script: scripts/backup.sh. Restauração: scripts/restaurar-backup.sh e
    # docs/DEPLOY.md. Copie o volume para fora da máquina (veja o DEPLOY.md).
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGHOST: banco
      PGUSER: ${BANCO_USUARIO:-crmbrl}
      PGPASSWORD: ${BANCO_SENHA:-crmbrl}
      PGDATABASE: ${BANCO_NOME:-crmbrl}
      BACKUP_DIR: /backups
      # Horário do dump diário (HH:MM, no fuso abaixo) e quantos dias guardar (0 = nunca apagar).
      BACKUP_HORARIO: ${BACKUP_HORARIO:-03:00}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      BACKUP_AO_INICIAR: ${BACKUP_AO_INICIAR:-false}
      TZ: ${BACKUP_FUSO:-America/Sao_Paulo}
    volumes:
      - backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      banco:
        condition: service_healthy

  web:
    build: ${FRONT_DIR:-../crmbrl}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:3000
      PORT: '8080'
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORTA:-8080}:8080'

volumes:
  banco-dados:
  arquivos-dados:
  # Modelos do Whisper baixados pelo serviço transcricao (não precisa de backup: baixa de novo).
  modelos-whisper:
  # Dumps do banco (serviço backup) e ultimo.json; a API lê só.
  backups:
